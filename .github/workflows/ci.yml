name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.16.0
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check

  framework-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.16.0
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm compat:next
      - run: pnpm compat:vite
