name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.16.0
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check

  framework-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.16.0
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm compat:next
      - run: pnpm compat:vite
